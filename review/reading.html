<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读</title>
<link rel="stylesheet" href="assets/board.css">
<style>.wrap { max-width: 1080px; }</style>
</head><body><div class="wrap">
<h1>阅读</h1>
<p><a class="back" href="index.html">← 返回看板</a></p>
<p class="sub">左侧选择日期，中间**一次只显示一篇**；点右侧箭头或下方「下一篇」看下一篇，点左侧箭头或「上一篇」回到上一篇（键盘 ←/→ 同效）。</p>

<div id="apiError" class="api-error hide"><span id="apiErrorMsg"></span><button id="apiRetry" type="button">重试</button></div>

<div class="reading-layout">
<aside class="reading-toc">
<div class="rtoc-title">阅读目录</div>
<nav class="rtoc-list" id="tocList"><p class="state loading">正在加载目录…</p></nav>
</aside>
<section class="reading-stage">
<div class="stage-head"><h2 id="stageDate"></h2><span class="stage-count" id="stageCount"></span></div>
<p class="stage-file" id="stageFile"></p>
<p class="f8note hide" id="todayNote"></p>
<div class="stage-body">
<button class="navbtn" id="navPrev" type="button" aria-label="上一篇" title="上一篇（←）" disabled>&#8592;</button>
<div class="stage-viewport" id="stageViewport"><p class="state loading">正在加载阅读…</p></div>
<button class="navbtn" id="navNext" type="button" aria-label="下一篇" title="下一篇（→）" disabled>&#8594;</button>
</div>
<div class="stage-foot" id="stageFoot">
<button class="pager" id="navPrev2" type="button" disabled>← 上一篇</button>
<span class="pager-count" id="footCount"></span>
<button class="pager" id="navNext2" type="button" disabled>下一篇 →</button>
</div>
</section>
</div>

<footer>提示：先自己读一遍，再点「整篇看中文」核对；理解题先作答，再展开对照答案（作答只存本机）。</footer>
</div>

<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script>
/* 阅读页 · API 驱动
 * 日期清单：GET /api/readings（倒序，首条即最新一天）
 * 今日状态：GET /api/readings/stats（用于「今天是否已生成」提示）
 * 当天全文：GET /api/readings/:date（段落级英中对照 + 生词注释 + 理解题）
 *
 * 交互口径（2026-09-30 修正）：选定某天后，**一次只显示当天的一篇**（其余卡片隐藏），
 *   左右箭头 / 底部「上一篇·下一篇」按钮 / 键盘 ←→ 均按 **篇序号** 翻页，回到第一篇即首篇。
 * 保留能力：默认最新一天、整篇看中文、生词注释内联、理解题「先答再看答案」、
 *           URL hash 同步（可刷新、可分享直达）。
 * 教学裁定（amy-teaching-plan §B.3.4）：① 同页目录，不嵌 iframe；
 *   ② 无中文对照时「整篇看中文」置灰而非消失；③ 理解题作答仅前端本地留存，暂不落库。
 * 四态：Loading / Error（横幅 + 重试）/ Empty（还没有阅读）/ 正常。
 */
(function () {
  'use strict';
  var viewport = UI.el('stageViewport');
  var tocList = UI.el('tocList');
  var elDate = UI.el('stageDate');
  var elCount = UI.el('stageCount');
  var elFile = UI.el('stageFile');
  var elToday = UI.el('todayNote');
  var elFoot = UI.el('footCount');
  var btnPrev = UI.el('navPrev');
  var btnNext = UI.el('navNext');
  var btnPrev2 = UI.el('navPrev2');
  var btnNext2 = UI.el('navNext2');

  var dates = [];      // 日期倒序，来自 /readings
  var cache = {};      // date -> { sourceFile, pieces }，来回切换不重复请求
  var curDate = '';
  var curIdx = 0;

  var ANS_KEY = 'reading-answers';   // 理解题作答本地留存（本期不落库）

  function currentList() {
    var day = cache[curDate];
    return (day && day.pieces) || [];
  }

  /* ---------- 理解题作答：仅存本机 ---------- */
  function loadAnswers() {
    try { return JSON.parse(localStorage.getItem(ANS_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveAnswer(key, val) {
    var all = loadAnswers();
    if (val) { all[key] = val; } else { delete all[key]; }
    try { localStorage.setItem(ANS_KEY, JSON.stringify(all)); } catch (e) { /* 隐私模式等，静默忽略 */ }
  }
  function fillAnswers() {
    var all = loadAnswers();
    Array.prototype.forEach.call(viewport.querySelectorAll('.qans'), function (t) {
      if (!t.dataset.key) { return; }
      if (all[t.dataset.key] != null) { t.value = all[t.dataset.key]; }
    });
  }

  /* ---------- 渲染：左侧目录 ---------- */
  function renderToc(list) {
    if (!list.length) {
      tocList.innerHTML = UI.stateHTML('empty', '还没有阅读');
      return;
    }
    tocList.innerHTML = list.map(function (x) {
      return '<button class="rtoc-item" type="button" data-date="' + UI.esc(x.date) + '">'
        + '<b>' + UI.esc(x.date) + '</b>'
        + '<span>' + (x.pieceCount || 0) + ' 篇</span></button>';
    }).join('');
  }
  function markToc(date) {
    Array.prototype.forEach.call(tocList.querySelectorAll('.rtoc-item'), function (b) {
      b.classList.toggle('on', b.dataset.date === date);
    });
  }

  /* ---------- 渲染：一篇 = 一张卡片（data-idx 记录篇序号，用于「一次只显示一篇」） ---------- */
  function ansKey(date, pieceNo, questionNo) {
    return date + '#' + (pieceNo == null ? '' : pieceNo) + '#' + (questionNo == null ? '' : questionNo);
  }
  function pieceHTML(p, date, idx) {
    var paras = p.paragraphs || [];
    var hasZh = paras.some(function (x) { return !!x.zh; });
    var out = '<article class="card rcard" data-date="' + UI.esc(date) + '" data-idx="' + idx + '">'
      + '<h3>第 ' + UI.esc(String(p.pieceNo == null ? '' : p.pieceNo)) + ' 篇 · ' + UI.esc(p.title || '未命名') + '</h3>'
      + '<p class="meta">级别：' + UI.esc(p.levelCode || '未标注')
      + ' ｜ 来源：' + UI.esc(p.source || '未标注')
      + (p.wordCount ? ' ｜ ' + p.wordCount + ' 词' : '') + '</p>';
    /* 裁定②：无中文对照时按钮置灰（保留可见），而不是隐藏 */
    out += hasZh
      ? '<button class="zhbtn" type="button">整篇看中文</button>'
      : '<button class="zhbtn" type="button" disabled title="本篇没有中文对照">整篇看中文</button>';
    out += '<div class="pairs">';
    paras.forEach(function (x) {
      out += '<p class="en">' + UI.esc(x.en) + '</p>';
      if (x.zh) { out += '<p class="zh" hidden>' + UI.esc(x.zh) + '</p>'; }
    });
    out += '</div>';
    if (p.vocabularyNotes) {
      /* 裁定④：生词注释内联，不跳词汇页 */
      out += '<h4>生词注释</h4><p class="vnotes">' + UI.esc(p.vocabularyNotes) + '</p>';
    }
    var qs = p.questions || [];
    if (qs.length) {
      out += '<h4>理解题</h4>';
      qs.forEach(function (q) {
        var no = q.questionNo ? q.questionNo + '. ' : '';
        out += '<div class="qitem">'
          + '<p class="qtext">' + UI.esc(no + (q.question || '')) + '</p>'
          /* 裁定③：先作答，再展开对照答案 */
          + '<textarea class="qans" rows="2" data-key="' + UI.esc(ansKey(date, p.pieceNo, q.questionNo)) + '"'
          + ' placeholder="先写你的答案，再展开对照"></textarea>'
          + '<div class="qfoot">';
        if (q.answer) {
          out += '<details class="qbox"><summary>看答案</summary><div class="qansbox">' + UI.esc(q.answer) + '</div></details>';
        } else {
          out += '<span class="qnoans">暂无答案</span>';
        }
        out += '<span class="qhint">作答只存本机</span></div></div>';
      });
    }
    return out + '</article>';
  }

  function render() {
    var list = currentList();
    var n = list.length;
    /* 关键：按 **篇序号** 过滤，一次只显示一篇（此前误按日期过滤，导致当天全部堆叠显示） */
    Array.prototype.forEach.call(viewport.querySelectorAll('.rcard'), function (c) {
      c.classList.toggle('hide', Number(c.dataset.idx) !== curIdx);
    });
    elDate.textContent = curDate;
    var pos = n ? ('第 ' + (curIdx + 1) + ' / ' + n + ' 篇') : '';
    elCount.textContent = pos;
    var cur = list[curIdx];
    if (elFoot) {
      elFoot.textContent = n > 1 ? (pos + ' ｜ ' + ((cur && cur.title) || '')) : '';
    }
    var file = (cache[curDate] && cache[curDate].sourceFile) || '';
    elFile.textContent = file ? ('read\\' + file) : '';
    var atFirst = curIdx <= 0;
    var atLast = curIdx >= n - 1;
    btnPrev.disabled = atFirst;
    btnNext.disabled = atLast;
    if (btnPrev2) { btnPrev2.disabled = atFirst; }
    if (btnNext2) { btnNext2.disabled = atLast; }
    markToc(curDate);
  }

  /* 切换篇目后回到正文顶部（文章长时箭头/底部按钮会滚出视野） */
  function scrollToStage() {
    var stage = document.querySelector('.reading-stage');
    if (stage && stage.scrollIntoView) { stage.scrollIntoView({ block: 'start' }); }
  }

  /* ---------- F8：「今天是否已生成」可见（硬要求，不可回退） ---------- */
  function setTodayNote(stats) {
    if (!elToday) { return; }
    if (!stats) { elToday.className = 'f8note hide'; return; }
    var today = stats.today || '';
    if (today && stats.lastReadDate === today) {
      elToday.className = 'f8note ok';
      elToday.textContent = '今日阅读已生成（' + today + '）';
    } else {
      elToday.className = 'f8note miss';
      elToday.textContent = '今日阅读尚未生成'
        + (stats.lastReadDate ? '，最近一次：' + stats.lastReadDate : '');
    }
  }

  function fetchDay(date) {
    if (cache[date]) { return Promise.resolve(cache[date]); }
    return API.get('/readings/' + encodeURIComponent(date)).then(function (d) {
      cache[date] = d || {};
      return cache[date];
    });
  }

  function showDay(date) {
    if (dates.indexOf(date) === -1) { date = dates[0]; }
    if (!date) { return Promise.resolve(); }
    curDate = date;
    curIdx = 0;                                     // 选定某天 → 从第一篇开始
    try {
      history.replaceState(null, '', '#' + encodeURIComponent(date));
    } catch (err) {
      location.hash = date;                         // file:// 等场景的兜底
    }
    elCount.textContent = '';
    elFile.textContent = '';
    if (elFoot) { elFoot.textContent = ''; }
    viewport.innerHTML = UI.stateHTML('loading', '正在加载阅读…');
    return fetchDay(date).then(function (day) {
      var pieces = day.pieces || [];
      viewport.innerHTML = pieces.length
        ? pieces.map(function (p, i) { return pieceHTML(p, date, i); }).join('')
        : UI.stateHTML('empty', '这一天还没有阅读内容');
      fillAnswers();
      render();
    }).catch(function (e) {
      viewport.innerHTML = UI.stateHTML('empty', '阅读加载失败：' + e.message);
      UI.partError('阅读正文', e);
    });
  }

  function step(delta) {
    var list = currentList();
    var next = curIdx + delta;
    if (next < 0 || next > list.length - 1) { return; }
    curIdx = next;
    render();
    scrollToStage();
  }

  /* ---------- 交互 ---------- */
  /* 「整篇看中文」：卡片动态渲染，用事件委托 */
  viewport.addEventListener('click', function (e) {
    var target = e.target;
    var btn = target && target.closest ? target.closest('.zhbtn') : null;
    if (!btn || btn.disabled) { return; }
    var scope = btn.closest('.rcard') || viewport;
    var blocks = scope.querySelectorAll('.zh');
    if (!blocks.length) { return; }
    var hidden = 0;
    Array.prototype.forEach.call(blocks, function (z) {
      if (z.hasAttribute('hidden')) { hidden += 1; }
    });
    Array.prototype.forEach.call(blocks, function (z) {
      if (hidden > 0) { z.removeAttribute('hidden'); } else { z.setAttribute('hidden', ''); }
    });
    btn.textContent = hidden > 0 ? '收起中文' : '整篇看中文';
  });

  /* 理解题作答：输入即存本机 */
  viewport.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('qans') && t.dataset.key) {
      saveAnswer(t.dataset.key, t.value.trim() ? t.value : '');
    }
  });

  /* 左侧目录：点击切换日期（回到该天第一篇，并把视线带回正文顶部） */
  tocList.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.rtoc-item') : null;
    if (btn && btn.dataset.date && btn.dataset.date !== curDate) {
      showDay(btn.dataset.date).then(scrollToStage);
    }
  });

  btnPrev.addEventListener('click', function () { step(-1); });
  btnNext.addEventListener('click', function () { step(1); });
  if (btnPrev2) { btnPrev2.addEventListener('click', function () { step(-1); }); }
  if (btnNext2) { btnNext2.addEventListener('click', function () { step(1); }); }
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { return; }
    if (e.key === 'ArrowLeft') { step(-1); }
    if (e.key === 'ArrowRight') { step(1); }
  });

  window.addEventListener('hashchange', function () {
    var want = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (want && want !== curDate) { showDay(want).then(scrollToStage); }
  });

  /* ---------- 启动 ---------- */
  function boot() {
    UI.clearError();
    viewport.innerHTML = UI.stateHTML('loading', '正在加载阅读…');
    tocList.innerHTML = UI.stateHTML('loading', '正在加载目录…');
    return Promise.all([
      API.getPage('/readings', 1, 200),
      API.get('/readings/stats').catch(function () { return null; })
    ]).then(function (res) {
      var d = res[0] || {};
      var list = d.list || [];
      dates = list.map(function (x) { return x.date; });
      renderToc(list);
      setTodayNote(res[1]);
      if (!dates.length) {
        viewport.innerHTML = UI.stateHTML('empty', '还没有阅读内容');
        elDate.textContent = '';
        return;
      }
      var want = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      return showDay(dates.indexOf(want) !== -1 ? want : dates[0]);
    }).catch(function (e) {
      tocList.innerHTML = UI.stateHTML('empty', '目录加载失败');
      viewport.innerHTML = UI.stateHTML('empty', '阅读目录加载失败：' + e.message);
      UI.partError('阅读', e);
    });
  }

  UI.onRetry(boot);
  boot();
})();
</script>
</body></html>
