<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>错词本</title>
<link rel="stylesheet" href="assets/board.css">
<style>
/* 本页特有：复习面板 */
.review { background: #fff; border: 1px solid #c9dcef; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.review .rhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.review .rprog { color: #6b6b66; font-size: 13px; }
.review .qtext { font-size: 17px; font-weight: 600; color: #a5392f; margin: 10px 0 6px; }
.review .acts { display: flex; gap: 10px; margin-top: 10px; }
.review .acts .ok { border-color: #c6e0c9; color: #2f6b3c; background: #eef7ef; }
.review .acts .no { border-color: #e0aca7; color: #a5392f; background: #fdf1f0; }
.review .feedback { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e3e2dc; }
.review .feedback p { margin: 2px 0; font-size: 14px; }
</style>
</head><body><div class="wrap">
<h1>错词本</h1>
<p><a class="plain" href="index.html">← 返回看板</a></p>
<p class="sub">每张卡列出四项硬指标：累计犯错次数、连续答对进度、优先级、错误类型，以及来源课号。</p>

<div id="apiError" class="api-error hide"><span id="apiErrorMsg"></span><button id="apiRetry" type="button">重试</button></div>

<div class="stats">
<div class="stat"><b id="stTotal" class="pending">…</b><span>错词总数</span></div>
<div class="stat"><b id="stPending" class="pending">…</b><span>未过关</span></div>
<div class="stat"><b id="stPassed" class="pending">…</b><span>已过关</span></div>
</div>

<p><button class="btn" type="button" id="startReview">开始复习（未过关错词）</button></p>
<div id="reviewPanel"></div>

<div class="tabs" id="statusTabs">
<button type="button" data-status="" class="on">全部</button>
<button type="button" data-status="pending">未过关</button>
<button type="button" data-status="passed">已过关</button>
</div>
<div class="tabs" id="typeTabs"></div>

<input id="q" placeholder="搜索错误点、正确形式或错因，输入关键词即时过滤">
<div id="mistakeList"><p class="state loading">正在加载错词…</p></div>
<footer>提示：连续答对 2 次即过关。复习队列按服务端默认优先级排序（前端不改顺序）。</footer>
</div>

<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script>
/* 错词本 · API 驱动 + 复习打卡（P3）
 * 列表：GET /api/mistakes/stats + GET /api/mistakes（全量）
 * Amy F2 四项硬指标：wrongCount / streak 进度条 / priority / errorType + 来源课号（均由接口返回）
 * 复习：GET /api/mistakes/pending（默认优先级序，前端不重排）→ POST /api/mistakes/:id/review
 *       （clientEventId 幂等）。题量按 Amy 断更规则（D≤2→5、3—6→7、≥7→8）；
 *       答后文案为 Amy §B.3.1 原文，非百分制。 */
(function () {
  'use strict';
  var el = UI.el;
  UI.onRetry(loadAll);

  var state = { status: '', type: '' };

  /* 复习题量（Amy amy-teaching-plan.md §B.3.1 / §2.5）：D = 距上次上课天数。
   *   D ≤ 2 → 5 题；D = 3—6 → 7 题；D ≥ 7 → 8—10 题（区间，前端暂取区间下限 8，待 Amy 定死具体值）。 */
  var SIZE_RULES = { normal: 5, gap: 7, longGap: 8 };

  function queueSize() {
    return API.get('/progress').then(function (p) {
      var D = API.daysSince(p && p.lastClassDate);
      if (D == null || D <= 2) { return SIZE_RULES.normal; }
      if (D <= 6) { return SIZE_RULES.gap; }
      return SIZE_RULES.longGap;
    }).catch(function () { return SIZE_RULES.normal; });
  }

  /* 答后反馈文案：固定句式、不用百分制（Amy amy-teaching-plan.md §B.3.1 L616—618 原文）：
   *   答对：`✅ 答对了 · 连续答对 {streak}/2`；streak>=2 追加 `—— 已过关，退出复习队列`。
   *   答错：`❌ 又错了 · 连续答对清零`；必须追加 `这是第 {wrongCount} 次犯，上次在第 {lastLessonNo} 课`。 */
  function feedbackLines(result, m, d) {
    var lines = [];
    if (result === 'correct') {
      lines.push('✅ 答对了 · 连续答对 ' + d.streak + '/2');
      if (d.streak >= 2) { lines.push('—— 已过关，退出复习队列'); }
    } else {
      lines.push('❌ 又错了 · 连续答对清零');
      var src = m.lastLessonNo ? ('第 ' + m.lastLessonNo + ' 课') : '诊断';   // 无课号显示「诊断」
      lines.push('这是第 ' + d.wrongCount + ' 次犯，上次在' + src);
    }
    return lines;
  }

  /* ---------------- 列表 + 筛选 ---------------- */
  function renderTypeTabs(byType) {
    var box = el('typeTabs');
    var items = [{ errorType: '', count: null }].concat(byType || []);
    box.innerHTML = items.map(function (t) {
      var label = t.errorType ? UI.label('errorType', t.errorType) : '全部类型';
      var cnt = t.count != null ? '（' + t.count + '）' : '';
      return '<button type="button" data-type="' + UI.esc(t.errorType) + '"'
        + (t.errorType === state.type ? ' class="on"' : '') + '>' + UI.esc(label + cnt) + '</button>';
    }).join('');
  }

  function applyFilter() {
    var v = (el('q').value || '').trim().toLowerCase();
    var cards = document.querySelectorAll('#mistakeList .mcard');
    var visible = 0;
    Array.prototype.forEach.call(cards, function (node) {
      var hitStatus = !state.status || node.dataset.status === state.status;
      var hitType = !state.type || node.dataset.type === state.type;
      var hitText = v === '' || String(node.dataset.text || '').indexOf(v) !== -1;
      var hit = hitStatus && hitType && hitText;
      node.classList.toggle('hide', !hit);
      if (hit) { visible += 1; }
    });
    var tip = document.querySelector('#mistakeList .filter-empty');
    if (visible === 0 && cards.length > 0) {
      if (!tip) {
        el('mistakeList').insertAdjacentHTML('beforeend',
          '<p class="state filter-empty">没有匹配的错词，换个筛选条件或关键词试试</p>');
      }
    } else if (tip) { tip.remove(); }
  }

  function loadStats() {
    return API.get('/mistakes/stats').then(function (d) {
      UI.setText('stTotal', d.total);
      UI.setText('stPending', d.pending);
      UI.setText('stPassed', d.passed);
      renderTypeTabs(d.byType);
    }).catch(function (e) { UI.partError('错词统计', e); });
  }

  function loadList() {
    el('mistakeList').innerHTML = UI.stateHTML('loading', '正在加载错词…');
    return API.getAll('/mistakes', { size: 100 }).then(function (d) {
      if (!d.list.length) { el('mistakeList').innerHTML = UI.stateHTML('empty', '暂无错词记录'); return; }
      el('mistakeList').innerHTML = d.list.map(UI.mistakeCard).join('');
      applyFilter();
    }).catch(function (e) { UI.partError('错词列表', e); });
  }

  function loadAll() {
    UI.clearError();
    return Promise.all([loadStats(), loadList()]);
  }

  /* ---------------- 复习打卡（P3） ---------------- */
  var queue = [], qi = 0, right = 0, wrong = 0;

  function startReview() {
    UI.clearError();
    el('reviewPanel').innerHTML = UI.stateHTML('loading', '正在准备复习…');
    queueSize().then(function (n) {
      return API.get('/mistakes/pending?limit=' + n);
    }).then(function (d) {
      queue = d.list || [];
      qi = 0; right = 0; wrong = 0;
      if (!queue.length) {
        el('reviewPanel').innerHTML = UI.stateHTML('empty', '当前没有未过关的错词，先休息一下。');
        return;
      }
      renderQ();
    }).catch(function (e) {
      el('reviewPanel').innerHTML = UI.stateHTML('empty', '复习队列加载失败：' + e.message);
      UI.partError('复习队列', e);
    });
  }

  function renderQ() {
    var m = queue[qi];
    el('reviewPanel').innerHTML = '<div class="review">'
      + '<div class="rhead"><b>复习</b><span class="rprog">第 ' + (qi + 1) + ' / ' + queue.length + ' 题</span>'
      + '<span class="rprog">来源 ' + (m.firstLessonNo ? ('第 ' + m.firstLessonNo + ' 课') : '诊断')
      + '　第 ' + (m.wrongCount || 0) + ' 次犯</span></div>'
      + '<div class="qtext">' + UI.esc(m.wrongText || '') + '</div>'
      + '<p class="why">错因：' + UI.esc(m.errorReason || '') + '</p>'
      + '<div class="acts">'
      + '<button class="btn ok" type="button" data-r="correct">我答对了</button>'
      + '<button class="btn no" type="button" data-r="wrong">又错了</button>'
      + '</div></div>';
  }

  function submit(result) {
    var m = queue[qi];
    var cid = 'fe-' + Date.now() + '-' + m.id + '-' + (qi + 1);   // 幂等键，避免重复提交
    var btns = el('reviewPanel').querySelectorAll('button');
    Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
    API.post('/mistakes/' + m.id + '/review', { result: result, clientEventId: cid }).then(function (d) {
      if (result === 'correct') { right += 1; } else { wrong += 1; }
      var lines = feedbackLines(result, m, d);
      var body = '<div class="feedback">' + lines.map(function (t) { return '<p>' + UI.esc(t) + '</p>'; }).join('')
        + '</div>'
        + '<div class="acts"><button class="btn" type="button" id="nextQ">'
        + (qi + 1 < queue.length ? '下一题' : '完成本轮') + '</button></div>';
      var panel = el('reviewPanel').querySelector('.review');
      panel.insertAdjacentHTML('beforeend', body);
      var next = el('nextQ');
      if (next) {
        next.addEventListener('click', function () {
          qi += 1;
          if (qi < queue.length) { renderQ(); } else { finish(); }
        });
      }
    }).catch(function (e) {
      UI.partError('提交复习结果', e);
      Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
    });
  }

  function finish() {
    el('reviewPanel').innerHTML = '<div class="review"><div class="rhead"><b>本轮完成</b></div>'
      + '<p>共 ' + queue.length + ' 题：答对 ' + right + '，答错 ' + wrong + '。</p>'
      + '<div class="acts"><button class="btn" type="button" id="againReview">再来一轮</button>'
      + '<button class="btn" type="button" id="closeReview">收起</button></div></div>';
    var again = el('againReview');
    if (again) { again.addEventListener('click', startReview); }
    var close = el('closeReview');
    if (close) { close.addEventListener('click', function () { el('reviewPanel').innerHTML = ''; }); }
    loadAll();   // 刷新统计与列表，反映最新 streak/status
  }

  /* ---------------- 事件 ---------------- */
  el('startReview').addEventListener('click', startReview);
  el('reviewPanel').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button[data-r]') : null;
    if (b) { submit(b.dataset.r); }
  });
  el('statusTabs').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if (!b) { return; }
    state.status = b.dataset.status;
    Array.prototype.forEach.call(el('statusTabs').children, function (x) { x.classList.toggle('on', x === b); });
    applyFilter();
  });
  el('typeTabs').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if (!b) { return; }
    state.type = b.dataset.type;
    Array.prototype.forEach.call(el('typeTabs').children, function (x) { x.classList.toggle('on', x === b); });
    applyFilter();
  });
  el('q').addEventListener('input', applyFilter);

  loadAll();
})();
</script>
</body></html>
