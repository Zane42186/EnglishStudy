<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读目录</title>
<link rel="stylesheet" href="assets/board.css">
</head><body class="rtoc-embed"><div class="wrap">
<nav class="rtoc">
  <p class="rtoc-title">阅读目录</p>
  <div id="tocBox"><p class="state loading">加载中…</p></div>
</nav>
</div>

<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script>
/* 阅读目录 · API 驱动（GET /api/readings，日期倒序）
 * 两种打开方式：
 *  ① 被 reading.html 以 iframe 嵌入（同屏联动）：点击 → postMessage 'reading-select'，
 *     并把自身高度回传给父页（'reading-toc-height'），目录区内不出现滚动条；
 *  ② 独立打开：点击 → location.href = 'reading.html#日期'，由阅读页按 hash 显示该天。
 * 四态：Loading / Error（带重试）/ Empty（还没有阅读）/ 正常。
 */
(function () {
  'use strict';
  var box = UI.el('tocBox');
  var items = [];
  var current = '';
  var inFrame = window.parent && window.parent !== window;

  /* 高度回传：iframe 里内容变化后都要重报，否则父页会留白 */
  function reportHeight() {
    if (!inFrame) { return; }
    window.parent.postMessage(
      { type: 'reading-toc-height', height: document.documentElement.scrollHeight }, '*'
    );
  }

  function activate(date) {
    current = date || '';
    items.forEach(function (b) { b.classList.toggle('on', b.dataset.date === current); });
  }

  function render(list) {
    if (!list.length) {
      box.innerHTML = UI.stateHTML('empty', '还没有阅读');
      reportHeight();
      return;
    }
    box.innerHTML = list.map(function (d) {
      var tip = (d.titles && d.titles.length) ? ' title="' + UI.esc(d.titles.join('、')) + '"' : '';
      return '<button type="button" class="rtoc-item" data-date="' + UI.esc(d.date) + '"' + tip + '>'
        + '<b>' + UI.esc(d.date) + '</b><span>' + (d.pieceCount || 0) + ' 篇</span></button>';
    }).join('');
    items = Array.prototype.slice.call(box.querySelectorAll('.rtoc-item'));
    items.forEach(function (b) {
      b.addEventListener('click', function () {
        activate(b.dataset.date);
        if (inFrame) {
          window.parent.postMessage({ type: 'reading-select', date: b.dataset.date }, '*');
        } else {
          location.href = 'reading.html#' + b.dataset.date;
        }
      });
    });
    activate(current);
    reportHeight();
  }

  function load() {
    box.innerHTML = UI.stateHTML('loading', '加载中…');
    reportHeight();
    return API.getPage('/readings', 1, 200).then(function (d) {
      render(d.list || []);
    }).catch(function (e) {
      box.innerHTML = UI.stateHTML('empty', '目录加载失败：' + e.message)
        + '<button class="btn" id="tocRetry" type="button">重试</button>';
      var btn = UI.el('tocRetry');
      if (btn) { btn.addEventListener('click', load); }
      reportHeight();
    });
  }

  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.type === 'reading-active') { activate(data.date); }
  });
  window.addEventListener('load', reportHeight);
  load();
})();
</script>
</body></html>
